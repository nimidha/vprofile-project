apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app-deployment
  labels:
    app: vprofile-app
spec:
  replicas: 2 # Runs 2 copies of your app simultaneously for high availability
  selector:
    matchLabels:
      app: vprofile-app
  template:
    metadata:
      labels:
        app: vprofile-app
    spec:
      containers:
      - name: vprofile-app-container
        image: vprofile-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vprofile-app-service
spec:
  type: NodePort
  selector:
    app: vprofile-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31180 # Exposes the app to your VM browser on this port
