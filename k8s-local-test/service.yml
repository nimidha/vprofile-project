apiVersion: v1
kind: Service
metadata:
  name: nginx-http-service
spec:
  type: NodePort         # Exposes the service on a specific port on the cluster node
  selector:
    app: web-server      # <--- Crucial! Links this service to any Pods labeled "app: web-server"
  ports:
    - port: 80           # The port the service listens on internally
      targetPort: 80     # The port inside the target Pod container to forward traffic to
