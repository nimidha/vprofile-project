version: '3.8'

services:
  # 1. Jenkins Orchestrator
  jenkins:
    container_name: devsecops-jenkins
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - ./volume/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock    # <--- CRUCIAL: Gives Jenkins access to host Docker
    networks:
      - devsecops-network
    user: root                                       # <--- CRUCIAL: Grants permissions to read the socket
  # 2. SonarQube (SAST Code Quality)
  sonarqube:
    image: sonarqube:lts-community
    container_name: devsecops-sonarqube
    ports:
      - "9001:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devsecops-network

  # 3. LocalStack (Mock AWS ECR Cloud Environment)
  local-registry:
    container_name: devsecops-registry
    image: registry:2
    ports:
      - "127.0.0.1:5001:5000"            # Map host port 5001 to container port 5000
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - "./volume/registry:/var/lib/registry"
    networks:
      - devsecops-network

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  localstack_data:

networks:
  devsecops-network:
    name: devsecops-network
