version: '3.8'

services:
  # 1. Jenkins Orchestrator
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: devsecops-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      # Allows Jenkins to run Docker commands on your host system
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops-network

  # 2. SonarQube (SAST Code Quality)
  sonarqube:
    image: sonarqube:lts-community
    container_name: devsecops-sonarqube
    ports:
      - "9001:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devsecops-network

  # 3. LocalStack (Mock AWS ECR Cloud Environment)
  localstack:
    image: localstack/localstack:latest
    container_name: devsecops-localstack
    user: root            
    privileged: true
    ports:
      - "4567:4566"
    environment:
      - SERVICES=ecr
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops-network

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  localstack_data:

networks:
  devsecops-network:
    name: devsecops-network
